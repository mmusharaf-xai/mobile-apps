<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e62b",
                        "glass-bg": "rgba(255, 255, 255, 0.4)",
                        "glass-border": "rgba(255, 255, 255, 0.6)",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "squircle": "3rem",
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/40 backdrop-blur-2xl border border-white/60 shadow-[0_20px_50px_rgba(0,0,0,0.05)];
            }
            .glass-button {
                @apply bg-white/50 backdrop-blur-md border border-white/70 shadow-sm transition-all active:scale-95;
            }
            .liquid-glow {
                box-shadow: 0 0 30px rgba(25, 230, 43, 0.4);
            }
            .stadium-gradient {
                background: radial-gradient(circle at 50% 0%, #f0fdf4 0%, #f8fafc 100%);
            }
            .victory-text {
                background: linear-gradient(135deg, #19e62b 0%, #0ea5e9 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
        }
    </style>
</head>
<body class="stadium-gradient font-display text-[#1a1c1a] min-h-screen relative overflow-x-hidden flex items-center justify-center p-4">
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed top-0 left-0 w-full h-full opacity-40 pointer-events-none" style="background-image: radial-gradient(#19e62b 0.5px, transparent 0.5px); background-size: 30px 30px;"></div>
<div class="flex flex-col w-full max-w-[420px] h-[844px] max-h-[95vh] relative z-10">
<main class="flex-1 flex flex-col gap-6 py-8">
<div class="glass-panel rounded-squircle flex-1 flex flex-col items-center p-8 relative overflow-hidden text-center border-t-2 border-t-white/80">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary/20 blur-[80px] -z-10"></div>
<div class="relative mb-6">
<div class="w-24 h-24 bg-gradient-to-br from-primary to-green-400 rounded-full flex items-center justify-center liquid-glow scale-110">
<span class="material-symbols-outlined text-white text-5xl fill-1">emoji_events</span>
</div>
<div class="absolute -top-2 -right-2 w-8 h-8 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-lg font-black">star</span>
</div>
</div>
<div class="space-y-2 mb-8">
<h1 class="text-3xl font-black tracking-tight text-[#1a1c1a] uppercase">Congratulations!</h1>
<p class="text-primary font-extrabold text-xl tracking-wide uppercase">You Won By 24 Runs</p>
</div>
<div class="w-full space-y-3 bg-white/20 backdrop-blur-sm rounded-[2rem] p-6 border border-white/40 mb-8">
<div class="flex justify-between items-center py-2 border-b border-white/30">
<span class="text-[#1a1c1a]/60 font-semibold text-sm">Your Score</span>
<span class="text-[#1a1c1a] font-black text-lg">78/2</span>
</div>
<div class="flex justify-between items-center py-2 border-b border-white/30">
<span class="text-[#1a1c1a]/60 font-semibold text-sm">Bot Score</span>
<span class="text-[#1a1c1a] font-black text-lg">54/6</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="text-[#1a1c1a]/60 font-semibold text-sm">Overs Played</span>
<span class="text-[#1a1c1a] font-black text-lg">5.0 / 5</span>
</div>
</div>
<div class="flex items-center gap-4 w-full mt-auto">
<div class="flex-1 flex flex-col items-center gap-2">
<div class="size-14 rounded-full border-4 border-white shadow-md overflow-hidden bg-white/80">

</div>
<span class="text-[10px] font-black text-[#1a1c1a]/40 tracking-widest uppercase">Champion</span>
</div>
<div class="h-[1px] flex-1 bg-gradient-to-r from-transparent via-white/60 to-transparent"></div>
<div class="flex-1 flex flex-col items-center gap-2 opacity-60">
<div class="size-14 rounded-full border-4 border-white shadow-md overflow-hidden bg-white/80 grayscale">
<img alt="Bot Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgs9rTYN-r7F98qrKwAy0rlWn1NuuX0pCnoBF64V2HIemkI5uoTSe2YEZt6P99zdxrqHwI6YA--D5Q0YbAzivcLW62ghUpS5jG0VzWxHH-BkTeFAgyVlroEaLUCkJhbGuY25We5-4Cx_TSPA0SvhNbK34S-JxtQn03gSWiVzbIVN4o_GksFci0dv_5DeUv9zwzOm_PbKJQj5ZWk4oEbVOEXVKOZrwJvthV5nAPJpIltOf4AKmTblctVpJlx70b_TSc-VKUDl6WL9E"/>
</div>
<span class="text-[10px] font-black text-[#1a1c1a]/40 tracking-widest uppercase">Runner Up</span>
</div>
</div>
</div>
<div class="flex flex-col gap-4 mt-auto">
<button class="w-full py-5 rounded-[2rem] bg-primary text-white font-black text-lg tracking-wider shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined font-bold">replay</span>
                    PLAY AGAIN
                </button>
<button class="w-full py-5 rounded-[2rem] bg-white/40 backdrop-blur-md border-2 border-white/60 text-[#1a1c1a] font-black text-lg tracking-wider active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined font-bold">home</span>
                    GO HOME
                </button>
</div>
</main>
<div class="flex justify-center pb-2">
<div class="w-32 h-1.5 bg-black/10 rounded-full"></div>
</div>
</div>

</body></html>
