<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e62b",
                        "wicket-red": "#ff3b3b",
                        "glass-bg": "rgba(255, 255, 255, 0.4)",
                        "glass-border": "rgba(255, 255, 255, 0.6)",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "squircle": "2.5rem",
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/40 backdrop-blur-xl border border-white/60 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)];
            }
            .glass-button {
                @apply bg-white/50 backdrop-blur-md border border-white/70 shadow-sm transition-all active:scale-95;
            }
            .liquid-glow {
                box-shadow: 0 0 20px rgba(25, 230, 43, 0.4);
            }
            .wicket-glow {
                box-shadow: 0 0 30px rgba(255, 59, 59, 0.6);
            }
            .stadium-gradient {
                background: radial-gradient(circle at top right, #e8f5e9 0%, #f0f4f8 50%, #e3f2fd 100%);
            }
            .squircle {
                border-radius: 40px;
            }
        }
        .progress-ring {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            filter: drop-shadow(0 0 8px rgba(25, 230, 43, 0.6));
        }
    </style>
</head>
<body class="stadium-gradient font-display text-[#1a1c1a] min-h-screen relative overflow-x-hidden">
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-30 pointer-events-none" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 40px 40px;"></div>
<div class="flex flex-col max-w-[480px] mx-auto min-h-screen relative z-10">
<header class="flex items-center justify-center px-6 py-6 bg-white/30 backdrop-blur-md border-b border-white/40 sticky top-0 z-50">
<div class="flex items-center gap-3">
<div class="text-primary drop-shadow-sm">
<span class="material-symbols-outlined text-3xl font-bold">sports_cricket</span>
</div>
<h2 class="text-[#1a1c1a] text-xl font-extrabold tracking-tight">Game Arena</h2>
</div>
</header>
<main class="flex-1 flex flex-col py-6 px-5 gap-4">
<div class="glass-panel squircle p-6 relative overflow-hidden border-t-2 border-t-primary/20">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/15 blur-3xl -mr-12 -mt-12"></div>
<div class="flex items-center justify-between gap-4 relative z-10">
<div class="flex flex-col gap-1">
<p class="text-primary text-[10px] font-black tracking-[0.2em] uppercase mb-1">Live Scoreboard</p>
<div class="flex items-baseline gap-2">
<h1 class="text-[#1a1c1a] text-5xl font-black tracking-tighter">24/2</h1>
<p class="text-[#1a1c1a]/50 text-xl font-bold">(2.1/5)</p>
</div>
<div class="mt-2 py-1 px-3 bg-black/5 rounded-full w-fit backdrop-blur-sm">
<p class="text-[#1a1c1a]/70 text-xs font-bold">Target: 48 runs</p>
</div>
</div>
<div class="w-24 h-24 rounded-3xl border-2 border-white/60 shadow-lg overflow-hidden">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAhV2aWsrf_ic8_GASu6_PCiw3KJnux-LJ5g_QQBaVkH4Mn1gDXTkvhVx6U9UccPOqoS97PjRzeVqhMATPRR4ZTr4otu_ML9rfOyOmz6AIAEyeJrgC06-AtAA7GxKoae_BEU15EYPCfu5_V9nrbGCtSnA76fcP2J6SYCRoxaIdQkKBykdziFJvnKbOE64_j15Edjd6HFH7V5R5JuBqGi8uxgeqjbuQfISXvaW18xfN8REdR9fdLm6tss61nXV-WX38WRtJxHThHD6Y");'></div>
</div>
</div>
</div>
<div class="glass-panel squircle p-6 flex flex-col items-center gap-6 border-l-2 border-l-primary/20 relative">
<h4 class="text-[#1a1c1a]/40 text-[10px] font-black tracking-[0.3em] uppercase">YOU vs BOT</h4>
<div class="flex items-center justify-around w-full">
<div class="flex flex-col items-center gap-3">
<div class="relative">
<div class="p-0.5 rounded-full bg-wicket-red/30 shadow-lg">
<div class="relative bg-center bg-no-repeat aspect-square bg-cover border-4 border-white rounded-full size-16 grayscale opacity-60" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAmmXZVo4op-z_y54Iq6tbd0otBBx5DjkZ2nb58iaRruLzm1RRZj2V7MgFydokNPhOKNwSmzTfSy_v09S_3DTVk1G_Xd0G_F-0ScGu1-D8JDa4G4WIffdpcnWPDPzVnwvLgC6dQWPQ7xJN0e-wWyMYDWWsonOfWdKTL3wLS1B_d15NcVX_aPAYlXhxsJtxYCper0P7kBmhwzZlul2Ssw2WKK6DkgAxJ5V5al47EsHM2Q8_4dmnAMqeNAlZcn-HLLUKd8b9CM6xCAfs");'>
<div class="absolute inset-0 flex items-center justify-center bg-wicket-red/20 rounded-full">
<span class="text-wicket-red font-black text-4xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)]">W</span>
</div>
</div>
</div>
<div class="absolute -bottom-1 -right-1 size-7 bg-wicket-red rounded-full border-2 border-white flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-[16px] font-bold">close</span>
</div>
</div>
<span class="text-[10px] font-black text-wicket-red tracking-[0.1em]">OUT</span>
<div class="size-12 rounded-2xl glass-button flex items-center justify-center border-2 border-wicket-red bg-wicket-red/10 mt-1">
<span class="text-wicket-red text-2xl font-black italic">6</span>
</div>
</div>
<div class="relative flex items-center justify-center">
<svg class="size-20 drop-shadow-[0_0_8px_rgba(25,230,43,0.3)]">
<circle class="text-white/20" cx="40" cy="40" fill="transparent" r="36" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary progress-ring" cx="40" cy="40" fill="transparent" r="36" stroke="currentColor" stroke-dasharray="226.2" stroke-dashoffset="180" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="absolute flex flex-col items-center justify-center">
<span class="text-xs font-black text-[#1a1c1a]/30 mb-[-4px]">VS</span>
<span class="text-2xl font-black text-[#1a1c1a] tabular-nums">02</span>
</div>
<div class="absolute z-20 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-wicket-red px-6 py-2 rounded-full wicket-glow border-2 border-white transform -rotate-12">
<span class="text-white font-black text-lg tracking-widest italic drop-shadow-sm">WICKET!</span>
</div>
</div>
<div class="flex flex-col items-center gap-3">
<div class="relative">
<div class="p-0.5 rounded-full bg-white/60 shadow-md">
<div class="bg-center bg-no-repeat aspect-square bg-cover border-4 border-white rounded-full size-16" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCgs9rTYN-r7F98qrKwAy0rlWn1NuuX0pCnoBF64V2HIemkI5uoTSe2YEZt6P99zdxrqHwI6YA--D5Q0YbAzivcLW62ghUpS5jG0VzWxHH-BkTeFAgyVlroEaLUCkJhbGuY25We5-4Cx_TSPA0SvhNbK34S-JxtQn03gSWiVzbIVN4o_GksFci0dv_5DeUv9zwzOm_PbKJQj5ZWk4oEbVOEXVKOZrwJvthV5nAPJpIltOf4AKmTblctVpJlx70b_TSc-VKUDl6WL9E");'></div>
</div>
<div class="absolute -bottom-1 -right-1 size-7 bg-slate-800 rounded-full border-2 border-white flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-[14px] font-bold">sports_baseball</span>
</div>
</div>
<span class="text-[10px] font-black text-[#1a1c1a]/50 tracking-[0.1em]">BOT</span>
<div class="size-12 rounded-2xl glass-button flex items-center justify-center mt-1">
<span class="text-[#1a1c1a]/60 text-2xl font-black italic">6</span>
</div>
</div>
</div>
</div>
<div class="glass-panel squircle p-6 border-b-2 border-b-primary/20">
<div class="flex flex-col items-center mb-6">
<h3 class="text-[#1a1c1a] tracking-[0.1em] text-sm font-black uppercase">Choose Your Move</h3>
</div>
<div class="grid grid-cols-3 gap-4">
<button class="glass-button aspect-square rounded-[1.5rem] flex items-center justify-center">
<span class="text-3xl font-black text-[#1a1c1a]/80">1</span>
</button>
<button class="glass-button aspect-square rounded-[1.5rem] flex items-center justify-center">
<span class="text-3xl font-black text-[#1a1c1a]/80">2</span>
</button>
<button class="glass-button aspect-square rounded-[1.5rem] flex items-center justify-center">
<span class="text-3xl font-black text-[#1a1c1a]/80">3</span>
</button>
<button class="glass-button aspect-square rounded-[1.5rem] flex items-center justify-center">
<span class="text-3xl font-black text-[#1a1c1a]/80">4</span>
</button>
<button class="glass-button aspect-square rounded-[1.5rem] flex items-center justify-center">
<span class="text-3xl font-black text-[#1a1c1a]/80">5</span>
</button>
<button class="glass-button aspect-square rounded-[1.5rem] flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-[#1a1c1a]/80 fill-1">thumb_up</span>
</button>
</div>
</div>
</main>
</div>

</body></html>
