<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HandCricket - Signup Refined</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Dm+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#39E079",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017"
                    },
                    fontFamily: {
                        display: "Dm Sans"
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "2rem",
                        xl: "3rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Dm Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .stadium-gradient {
            background: radial-gradient(circle at top, #1a3a2a 0%, #102217 70%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<div class="relative w-full max-w-[420px] h-[844px] bg-background-dark border-8 border-[#1a3324] rounded-[3rem] shadow-2xl overflow-hidden flex flex-col stadium-gradient">
<div class="w-full h-10 flex justify-between items-center px-8 pt-4 shrink-0">
<span class="text-white text-xs font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-white text-[14px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-white text-[14px]">wifi</span>
<span class="material-symbols-outlined text-white text-[14px]">battery_full</span>
</div>
</div>
<header class="flex flex-col items-center mt-6 px-6 shrink-0">
<div class="w-14 h-14 bg-primary rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(19,236,106,0.4)]">
<span class="material-symbols-outlined text-background-dark text-3xl font-bold">sports_cricket</span>
</div>
<h1 class="text-white text-2xl font-bold mt-3 tracking-tight">HandCricket</h1>
<p class="text-[#92c9a8] text-xs mt-0.5">Enter the digital arena</p>
</header>
<div class="px-8 mt-8 shrink-0">
<div class="flex h-11 w-full items-center justify-center rounded-full bg-[#193324] p-1 border border-[#234832]">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:text-background-dark text-[#92c9a8] text-xs font-bold leading-normal transition-all">
<span class="truncate">Login</span>
<input class="invisible w-0" name="auth-mode" type="radio" value="Login"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:text-background-dark text-[#92c9a8] text-xs font-bold leading-normal transition-all">
<span class="truncate">Signup</span>
<input checked="" class="invisible w-0" name="auth-mode" type="radio" value="Signup"/>
</label>
</div>
</div>
<div class="flex-1 overflow-y-auto hide-scrollbar px-8 pt-6 pb-4">
<div class="space-y-6">
<h2 class="text-white text-lg font-bold text-center">New Player Profile</h2>
<div class="space-y-2">
<label class="text-[#92c9a8] text-[11px] font-bold uppercase tracking-widest ml-1">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#92c9a8] text-xl">account_circle</span>
<input class="w-full bg-[#193324] border border-[#326747] rounded-full h-12 pl-12 pr-6 text-white placeholder:text-[#326747] focus:ring-1 focus:ring-primary focus:border-primary transition-all text-sm" placeholder="PitchKing" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-[#92c9a8] text-[11px] font-bold uppercase tracking-widest ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#92c9a8] text-xl">alternate_email</span>
<input class="w-full bg-[#193324] border border-[#326747] rounded-full h-12 pl-12 pr-6 text-white placeholder:text-[#326747] focus:ring-1 focus:ring-primary focus:border-primary transition-all text-sm" placeholder="player@stadium.com" type="email"/>
</div>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<label class="text-[#92c9a8] text-[11px] font-bold uppercase tracking-widest">Choose Avatar</label>
<span class="text-primary text-[9px] font-bold uppercase tracking-tighter">Swipe</span>
</div>
<div class="flex overflow-x-auto gap-3 py-2 hide-scrollbar -mx-2 px-2">
<div class="flex-shrink-0 relative cursor-pointer">
<div class="w-16 h-16 rounded-full border-2 border-primary p-0.5 bg-[#193324] overflow-hidden">
<div class="w-full h-full rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">sports_cricket</span>
</div>
</div>
<div class="absolute -top-1 -right-1 bg-primary text-background-dark rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] font-bold">check</span>
</div>
</div>
<div class="flex-shrink-0 relative cursor-pointer">
<div class="w-16 h-16 rounded-full border-2 border-transparent p-0.5 bg-[#193324] overflow-hidden hover:border-[#326747]">
<div class="w-full h-full rounded-full bg-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-white/40 text-3xl">front_hand</span>
</div>
</div>
</div>
<div class="flex-shrink-0 relative cursor-pointer">
<div class="w-16 h-16 rounded-full border-2 border-transparent p-0.5 bg-[#193324] overflow-hidden hover:border-[#326747]">
<div class="w-full h-full rounded-full bg-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-white/40 text-3xl">sports_baseball</span>
</div>
</div>
</div>
<div class="flex-shrink-0 relative cursor-pointer">
<div class="w-16 h-16 rounded-full border-2 border-transparent p-0.5 bg-[#193324] overflow-hidden hover:border-[#326747]">
<div class="w-full h-full rounded-full bg-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-white/40 text-3xl">military_tech</span>
</div>
</div>
</div>
<div class="flex-shrink-0 relative cursor-pointer pr-4">
<div class="w-16 h-16 rounded-full border-2 border-transparent p-0.5 bg-[#193324] overflow-hidden hover:border-[#326747]">
<div class="w-full h-full rounded-full bg-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-white/40 text-3xl">emoji_events</span>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="px-8 pb-10 pt-4 bg-transparent mt-auto">
<button class="w-full h-14 bg-primary text-background-dark font-black text-lg uppercase tracking-wider rounded-full shadow-[0_8px_30px_rgb(19,236,106,0.3)] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Start Playing</span>
<span class="material-symbols-outlined font-bold">sports_cricket</span>
</button>
<p class="text-[#92c9a8] text-[11px] text-center mt-6">
                Already on the squad? <span class="text-primary font-bold underline cursor-pointer">Login</span>
</p>
</div>
<div class="w-full flex justify-center pb-2 shrink-0">
<div class="w-32 h-1 bg-white/20 rounded-full"></div>
</div>
</div>

</body></html>
