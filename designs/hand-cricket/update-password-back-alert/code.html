<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HandCricket - Unsaved Changes Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e62b",
                        "brand-green": "#19e62b",
                        "off-white": "#f8f9fa",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "system-ui", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px",
                        "squircle": "2.5rem"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            @apply bg-gray-100 text-gray-900 overflow-hidden;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .profile-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            @apply bg-off-white shadow-2xl min-[480px]:my-8 min-[480px]:h-[calc(100vh-64px)] min-[480px]:rounded-[3rem] overflow-hidden relative;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1;
        }.glass-modal {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .squircle-card {
            border-radius: 2.5rem;
            mask-image: paint(squircle);}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
<div class="profile-container border border-gray-200">
<div class="flex flex-col h-full overflow-hidden blur-sm pointer-events-none">
<header class="sticky top-0 z-50 w-full bg-off-white/80 backdrop-blur-md border-b border-gray-100 px-6 py-6 flex items-center justify-between">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-200 transition-all">
<span class="material-symbols-outlined text-gray-800 text-2xl font-bold">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold text-gray-900 tracking-tight">Profile Settings</h1>
<div class="w-10"></div>
</header>
<main class="flex-1 overflow-y-auto pb-48">
<section class="flex flex-col items-center py-10">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-32 border-4 border-white shadow-lg" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAh8r_Fu2DMwH7rZozkdHDS8YcgSDnsUqg2YhK9a2BBDbFMq4am8vnWmRjcLeiG6DREeNuBtv0Bob13d8HSi0w_mODyZMt2KgyeBhDN3OmlRqj3JiG55DUQnzjpt-OzXDpZldauDnHjHWUp-Y3fIvbYJ9LOL0Tp9cl43cfh4DWJqA6MLVxjri5drTA26ksNYIvvxOlXVFCm0EQx7t39saFE4HwONWY40GsLr_yRYRNSVbmKTjp3i9l6E2zq-WYZSdnumReCN4JbMQ8");'>
</div>
</div>
<div class="mt-6 flex items-center gap-2 text-gray-500 bg-white px-5 py-2 rounded-full border border-gray-200 shadow-sm">
<span class="material-symbols-outlined text-lg text-brand-green">lock</span>
<span class="text-sm font-medium">john.doe@email.com</span>
</div>
</section>
<section class="px-6 space-y-5">
<div class="space-y-2">
<label class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.1em] ml-1">Username</label>
<div class="flex items-center justify-between bg-white border border-gray-200 rounded-2xl px-5 py-4 shadow-sm">
<span class="text-gray-800 font-semibold">JohnDoe_99</span>
<button class="text-brand-green p-1">
<span class="material-symbols-outlined text-[22px]">edit_square</span>
</button>
</div>
</div>
<div class="w-full flex items-center justify-between bg-white border border-gray-200 rounded-2xl px-5 py-4 shadow-sm">
<div class="flex items-center gap-4">
<div class="size-11 rounded-xl bg-brand-green/10 flex items-center justify-center text-brand-green">
<span class="material-symbols-outlined text-[24px]">key</span>
</div>
<div class="text-left">
<span class="block font-bold text-gray-900">Change Password</span>
<span class="text-[10px] text-gray-400 font-medium">Last updated 2 months ago</span>
</div>
</div>
<span class="material-symbols-outlined text-gray-300">chevron_right</span>
</div>
<div class="w-full flex items-center justify-between bg-white border border-gray-200 rounded-2xl px-5 py-4 shadow-sm">
<div class="flex items-center gap-4">
<div class="size-11 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500">
<span class="material-symbols-outlined text-[24px]">dark_mode</span>
</div>
<div class="text-left">
<span class="block font-bold text-gray-900">Dark Mode</span>
<span class="text-[10px] text-gray-400 font-medium">Currently disabled</span>
</div>
</div>
<div class="w-12 h-6 bg-gray-200 rounded-full relative">
<div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow-sm"></div>
</div>
</div>
</section>
</main>
<div class="absolute bottom-0 left-0 right-0 bg-off-white/95 backdrop-blur-xl px-6 pt-4 pb-10 flex flex-col gap-3 border-t border-gray-100">
<button class="w-full bg-brand-green text-black font-extrabold h-14 rounded-2xl shadow-lg shadow-brand-green/20 text-base tracking-wide flex items-center justify-center uppercase">
                    Save Changes
                </button>
<button class="w-full flex items-center justify-center gap-2 py-3 text-red-500 font-bold text-sm uppercase tracking-wider">
<span class="material-symbols-outlined text-xl">logout</span>
                    Logout
                </button>
</div>
</div>
<div class="absolute inset-0 z-[100] flex items-center justify-center px-6 bg-black/5">
<div class="glass-modal w-full max-w-[340px] p-8 rounded-squircle shadow-2xl flex flex-col items-center text-center ring-1 ring-white/60 relative overflow-hidden">
<div class="absolute inset-0 border-[1.5px] border-white/40 rounded-squircle pointer-events-none"></div>
<h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-3">Wait!</h2>
<p class="text-[15px] leading-relaxed text-gray-600 font-medium mb-8">
                    You have unsaved changes. Would you like to save them before going back?
                </p>
<div class="w-full flex flex-col gap-3">
<button class="w-full bg-brand-green hover:bg-[#16d127] text-black font-bold h-[56px] rounded-2xl shadow-lg shadow-brand-green/10 transition-transform active:scale-95 text-[15px]">
                        Save and Go Back
                    </button>
<button class="w-full border-2 border-brand-green/60 text-brand-green font-bold h-[56px] rounded-2xl hover:bg-brand-green/5 transition-all active:scale-95 text-[15px]">
                        Go Back
                    </button>
<button class="w-full py-3 text-gray-500 font-semibold text-[15px] hover:text-gray-900 transition-colors active:scale-95">
                        Cancel
                    </button>
</div>
</div>
</div>
</div>

</body></html>
